title: Marko Milić — software & security notes
description: > # this means to ignore newlines until "baseurl:"
  Notes on software and security by Marko Milić — short, practical explainers
  on identity, security, AI and everyday engineering.
permalink: ':title/'
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://constantine2nd.github.io" # the base hostname & protocol for your site, e.g. http://example.com

# Author Settings
author: Marko Milić # add your name
author-img: marko-milic.jpg # add your photo
about-author: Software engineer working on identity, security and AI. No technology fixes bad design, it only mitigates it. # add description
social-facebook: # add your Facebook handle
social-github: constantine2nd # add your Github handle
social-linkedin: marko-milić-4332a81b9 # add your Linkedin handle
social-email: marko.milic@yahoo.com # add your Email address

# Disqus
discus-identifier: # add your disqus identifier to enable comments

# Tracker
analytics: # Google Analytics

# Build Settings
markdown: kramdown
plugins:
  - jekyll-sitemap
  - jekyll-paginate
  - jemoji

paginate: 8
paginate_path: "/page/:num"

exclude: ["node_modules", "gulpfile.js", "package.json", "yarn.lock"]

# Keep the Search Console verification file out of the sitemap
defaults:
  - scope:
      path: "google2357b3a859979821.html"
    values:
      sitemap: false
